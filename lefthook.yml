commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-push:
  jobs:
    - name: packages audit
      tags:
        - frontend
        - security
      run: pnpm audit

pre-commit:
  parallel: true
  jobs:
    - name: biome format
      run: pnpm biome format --write {staged_files}
      glob: "*.{js,ts,jsx,tsx,json,md}"
