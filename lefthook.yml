commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1} || yarn commitlint --edit {1} || npx commitlint --edit {1}

pre-push:
  jobs:
    - name: packages audit
      tags:
        - frontend
        - security
      run: pnpm audit || yarn audit || npm audit

pre-commit:
  parallel: true
  jobs:
    - name: biome check
      run: pnpm biome check {staged_files} || yarn biome check {staged_files} || npx biome check {staged_files}
      glob: "*.{js,ts,jsx,tsx,json,md}"

    - name: biome format
      run: pnpm biome format --write {staged_files} || yarn biome format --write {staged_files} || npx biome format --write {staged_files}
      glob: "*.{js,ts,jsx,tsx,json,md}"

    - name: typecheck
      run: pnpm tsc --noEmit || yarn tsc --noEmit || npx tsc --noEmit
      glob: "*.{ts,tsx}"

    # - name: test
    #   run: pnpm vitest --run || yarn vitest --run || npx vitest --run
    #   glob: "*.{js,ts,jsx,tsx}"