# Staging stage (for develop branch)
staging:
  stage: staging
  only:
    - develop
  dependencies:
    - build_portal
    - build_office
    - build_api
  services:
    - postgres:16 # PostgreSQL container
  script:
    - "pnpm install"
    - "pnpm run format"

deploy_portal:
  stage: deploy
  script:
    - "echo 'Deploying portal to Coolify...'"
    - "echo 'Branch: $CI_COMMIT_BRANCH'"
    - "echo 'API Token: $COOLIFY_API_TOKEN'"
    - "echo 'Webhook: $COOLIFY_WEBHOOK_PORTAL'"
    - 'curl -X POST "$COOLIFY_WEBHOOK_PORTAL" -H "Authorization: Bearer $COOLIFY_API_TOKEN" -w '' HTTP Status: %{http_code}'''
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - apps/frontend/portal/**/*
        - packages/shared/**/*
        - packages/ui/**/*

# Deploy office to Coolify
deploy_office:
  stage: deploy
  script:
    - "echo 'Deploying office to Coolify...'"
    - 'curl -X POST "$COOLIFY_WEBHOOK_OFFICE" -H "Authorization: Bearer $COOLIFY_API_TOKEN"'
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - apps/frontend/office/**/*
        - packages/shared/**/*
        - packages/ui/**/* # Added per your update

# Deploy API to Coolify
deploy_api:
  stage: deploy
  script:
    - "echo 'Deploying api to Coolify...'"
    - 'curl -X POST "$COOLIFY_WEBHOOK_API" -H "Authorization: Bearer $COOLIFY_API_TOKEN"'
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      changes:
        - apps/backend/api/**/*
        - packages/shared/**/*
        - packages/ui/**/* # Added for consistency, adjust if not needed
