variables:
  GIT_DEPTH: "0" # Required for semantic-release
  PNPM_CACHE_FOLDER: .pnpm-store

default:
  image: node:22

stages:
  - release
  - build
  - staging

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

release:
  stage: release
  only:
    - develop
  before_script:
    - npm install -g corepack@latest
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm install
  script:
    - pnpm semantic-release
  variables:
    GITLAB_TOKEN: $GITLAB_TOKEN # Use a real Personal Access Token with `api` scope

build:
  stage: build
  only:
    - merge_requests
  before_script:
    - npm install -g corepack@latest
    - corepack enable
    - corepack prepare pnpm@9.0.0 --activate
    - pnpm install
  script:
    - pnpm run format:error
    - pnpm run build

staging:
  stage: staging
  image: node:22
  only:
    - develop
  before_script:
    - npm install --global corepack@latest
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm install
  script:
    - export NEXT_PUBLIC_APP_VERSION=$(node -p "require('./package.json').version")
    - pnpm run format
    - NEXT_PUBLIC_APP_VERSION=$NEXT_PUBLIC_APP_VERSION pnpm run build
    - |
      echo "Updating APP_VERSION in Coolify environment variables to $NEXT_PUBLIC_APP_VERSION"
      curl -X PATCH \
        "$COOLIFY_URL/api/v1/applications/$COOLIFY_APPLICATION_UUID/envs" \
        -H "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" \
        -H "Content-Type: application/json" \
        --data '{
          "key": "APP_VERSION",
          "value": "'"$NEXT_PUBLIC_APP_VERSION"'",
          "is_build_time": true,
          "is_literal": true,
          "is_preview": false
        }'
    - |
      curl -X GET "$COOLIFY_URL/api/v1/deploy?tag=shega&force=false" \
        -H "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN"

